name: Standard CI

on:
  workflow_call:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install Linting Tools
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # Install actionlint
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv actionlint /usr/local/bin/
      - name: Lint Workflows
        run: actionlint
      - name: Lint Shell Scripts
        run: |
          if [ -d "scripts" ]; then
            find scripts -name "*.sh" -exec shellcheck {} +
          fi
      - name: Check Formatting
        run: |
          if [ -f "Cargo.toml" ]; then cargo fmt --check; fi
          if [ -f "package.json" ]; then npm run format:check; fi

  governance-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Run Governance Verifications
        run: |
          for script in scripts/verify_*.py; do
            echo "Running $script..."
            python3 "$script"
          done
      - name: Generate Coverage Report
        run: python3 scripts/lightning_coverage_report.py
      - name: Run Lightning Coverage Gate
        run: |
          if [ -f "scripts/lightning_coverage_gate.sh" ]; then
            bash scripts/lightning_coverage_gate.sh
          fi
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lightning-coverage-report
          path: lightning-coverage.json

  security:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      (hashFiles('**/package-lock.json', '**/pnpm-lock.yaml', '**/Cargo.lock') != '')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Run Tests
        run: |
          if [ -f "Cargo.toml" ]; then cargo test; fi
          if [ -f "package.json" ]; then npm test; fi
