name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.MD"
      - "repository-taxonomy.md"
      - "REVIEWS.md"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Prepare Docs
        run: |
          if [ ! -d "docs" ]; then
            mkdir docs
            echo "<h1>Conxian Organization Defaults</h1><p>Documentation is being prepared.</p>" > docs/index.html
          fi
          # Sync root governance files to docs for hosting if they aren't already linked
          cp README.MD docs/README.md
          cp repository-taxonomy.md docs/repository-taxonomy.md
          cp REVIEWS.md docs/REVIEWS.md
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
