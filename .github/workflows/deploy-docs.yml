name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.MD"
      - "repository-taxonomy.md"
      - "REVIEWS.md"
      - ".github/workflows/deploy-docs.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Prepare Docs
        run: |
          # Ensure docs directory exists
          mkdir -p docs

          # Sync root governance files to docs for hosting
          # Using -f to overwrite and ensure latest versions are hosted
          cp -f README.MD docs/README.md
          cp -f repository-taxonomy.md docs/repository-taxonomy.md
          cp -f REVIEWS.md docs/REVIEWS.md

          # Verify index file exists, create a basic one if it doesn't
          if [ ! -f "docs/index.md" ] && [ ! -f "docs/index.html" ]; then
            echo "# Conxian Organization Defaults" > docs/index.md
            echo "Documentation is being prepared." >> docs/index.md
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
