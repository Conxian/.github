name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.MD"
      - "repository-taxonomy.md"
      - "REVIEWS.md"
      - ".github/workflows/deploy-docs.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Prepare Docs
        run: |
          # Ensure docs directory exists
          mkdir -p docs

          # Sync root governance files to docs for hosting
          # Using -f to overwrite and ensure latest versions are hosted
          cp -f README.MD docs/README.md
          cp -f repository-taxonomy.md docs/repository-taxonomy.md
          cp -f REVIEWS.md docs/REVIEWS.md

          # Verify index file exists, create a basic one if it doesn't
          if [ ! -f "docs/index.md" ] && [ ! -f "docs/index.html" ]; then
            echo "# Conxian Organization Defaults" > docs/index.md
            echo "Documentation is being prepared." >> docs/index.md
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: "./docs"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
